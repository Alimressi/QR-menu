<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Menu — live restaurant menus</title>
  <meta name="description" content="Multi-restaurant QR menu platform: Next.js + Prisma on Cloudflare Workers.">
  <style>
    html,body{margin:0;height:100%}
    body{font:16px/1.6 -apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:#f3efe7;color:#26231d;display:flex;align-items:center;justify-content:center}
    .card{max-width:520px;padding:40px;text-align:center}
    h1{font-family:Georgia,serif;font-size:40px;margin:0 0 8px}
    p{color:#8a8579;margin:0 0 28px}
    a.menu{display:block;margin:10px 0;padding:14px 18px;border:1px solid #d8d0c2;
      border-radius:12px;text-decoration:none;color:#26231d;background:#fff;font-weight:600}
    a.menu:hover{border-color:#b3a173}
  </style>
</head>
<body>
  <div class="card">
    <h1>QR&nbsp;Menu</h1>
    <p>Live multilingual restaurant menus · Next.js + Prisma on Cloudflare Workers</p>
    <a class="menu" href="https://qr-menu.imran-ask-2006.workers.dev/lumiere">Lumière — European kitchen</a>
    <a class="menu" href="https://qr-menu.imran-ask-2006.workers.dev/ninelives">Nine Lives — bar &amp; lounge</a>
    <a class="menu" href="https://qr-menu.imran-ask-2006.workers.dev/gamepoint">GamePoint</a>
  </div>
</body>
</html>
